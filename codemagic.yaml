workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Generate iOS platform and Sync
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Build iOS App (SPM)
        script: |
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build
      - name: Package into IPA
        script: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build && zip -r tik-chat.ipa Payload
    artifacts:
      - build/*.ipa